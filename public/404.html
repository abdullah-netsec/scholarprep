<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>404 — Page Not Found | ScholarPrep</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #120e0c;
      color: #faf7f2;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      padding: 24px;
      text-align: center;
    }
    .card {
      max-width: 480px;
      width: 100%;
      background: #1a1411;
      border: 1px solid rgba(255,255,255,0.1);
      border-top: 4px solid #D47742;
      border-radius: 16px;
      padding: 40px 28px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
    .code {
      font-size: 3.5rem;
      font-weight: 800;
      color: #D47742;
      line-height: 1;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 1.5rem;
      margin: 0 0 12px 0;
    }
    p {
      color: #bdaaa0;
      font-size: 0.95rem;
      line-height: 1.6;
      margin: 0 0 28px 0;
    }
    .btn {
      display: inline-block;
      background: #624536;
      color: #faf7f2;
      text-decoration: none;
      font-weight: 700;
      padding: 12px 24px;
      border-radius: 8px;
    }
    .btn:hover {
      background: #785644;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="code">404</div>
    <h1>Page Not Found</h1>
    <p>The page you are looking for doesn't exist or has moved. Head back to the ScholarPrep portal to continue your GAT practice.</p>
    <a href="/" class="btn">Return to ScholarPrep Home</a>
  </main>
</body>
</html>
